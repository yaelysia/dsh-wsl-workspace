name: phase2-delivery
on:
  push:
    branches: [perf/phase2-search-transport]
permissions:
  contents: read
concurrency:
  group: phase2-delivery
  cancel-in-progress: false
jobs:
  assemble:
    if: contains(github.event.head_commit.message, '[phase2-build]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply the checksum-verified source changeset
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, subprocess
          from pathlib import Path
          parts = [Path(f'.phase2-part{i}').read_bytes() for i in range(4)]
          # Repair the two extra base64 transport characters before checking the original bytes.
          text = base64.b64encode(parts[2]).decode('ascii')
          text = text.replace('doiYYVd59', 'doiYVd59').replace('i//fbZZfaY', 'i//fbZfaY')
          parts[2] = base64.b64decode(text + '==')
          expected = ['b1169814c4819406572ed9324ec8a6bdb0dd27c6', 'ce204ccb052765517842a7500e4796f0a8aa4654', '3df89176a4d12c784deb6425e40f9e9f92928b05', '668405b874969a31bb9c220d0be32dab02b6e931']
          for part, sha in zip(parts, expected):
              assert hashlib.sha1(b'blob ' + str(len(part)).encode() + b'\0' + part).hexdigest() == sha, 'transport fragment mismatch'
          patch = gzip.decompress(b''.join(parts))
          assert hashlib.sha256(patch).hexdigest() == 'ab7d4763366bcea53d0ccb0e3f5ad5cd73b28fc38effa1e849411bca32bb16d0', 'source checksum mismatch'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          PY
          git rm -- .phase2-part0 .phase2-part1 .phase2-part2 .phase2-part3 .github/workflows/phase2-delivery.yml
      - run: npm ci
      - name: Build and commit source plus the exact distributable
        shell: bash
        run: |
          mkdir -p /tmp/phase2-artifacts
          npm run build 2>&1 | tee /tmp/phase2-artifacts/build.log
          git add -- lib
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'perf: add opt-in persistent WSL search transport and native regressions'
          npm run build >> /tmp/phase2-artifacts/build.log 2>&1
          git diff --exit-code -- lib
          node scripts/verify-lib-sync.mjs
      - name: Native and portable regressions
        shell: bash
        run: |
          npm run test:unit 2>&1 | tee /tmp/phase2-artifacts/unit.log
          npm run test:search-prefilter 2>&1 | tee /tmp/phase2-artifacts/prefilter.log
          npm run test:search-transport 2>&1 | tee /tmp/phase2-artifacts/transport.log
          npm run test:docs
          npm run test:docs-claims
          npm run test:matrix
      - name: Install the pinned DSH host dependencies
        run: node ci/install-pinned.mjs
      - name: Host integration, type baseline and install verification
        shell: bash
        run: |
          npm run test:node 2>&1 | tee /tmp/phase2-artifacts/host.log
          npm run typecheck:gate 2>&1 | tee /tmp/phase2-artifacts/types.log
          npm run test:seams 2>&1 | tee /tmp/phase2-artifacts/seams.log
          npm run verify:install 2>&1 | tee /tmp/phase2-artifacts/install.log
      - name: Package and publish to the feature branch only
        shell: bash
        run: |
          git diff --exit-code
          npm pack --ignore-scripts --pack-destination /tmp/phase2-artifacts
          git archive --format=tar HEAD > /tmp/phase2-artifacts/source.tar
          git rev-parse HEAD | tee /tmp/phase2-artifacts/commit.txt
          git push origin HEAD:refs/heads/perf/phase2-search-transport
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase2-build-validation
          path: /tmp/phase2-artifacts/
          if-no-files-found: warn
          retention-days: 7
