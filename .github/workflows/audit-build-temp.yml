name: audit-build-temp
on:
  push:
    branches: ['fix/strip-wsl-skills-audit']
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/audit-build-temp.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: node ci/install-pinned.mjs
      - name: Compile the independently named plugin and check source/bundle
        run: npm run build
      - name: Run pure units, host fixtures and removed-Skills regressions
        run: |
          set -euo pipefail
          npm run test:unit
          npm run test:node
          npm run test:docs
          npm run test:docs-claims
          npm run typecheck:gate
          npm run test:version -- --base b3866cf0bab785619c5fda93933a5ed3f8e7503e
      - name: Publish tested committed lib artifacts
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A lib
          if ! git diff --cached --quiet; then
            git commit -m 'build(audit): synchronize tested 0.7.11 WSL-only library'
            git fetch origin refs/heads/fix/strip-wsl-skills-audit
            if ! git diff --quiet HEAD..FETCH_HEAD -- src package.json package-lock.json tests scripts; then
              echo 'Runtime sources changed during builder; refusing stale artifact push'
              exit 1
            fi
            git rebase FETCH_HEAD
            git push origin HEAD:refs/heads/fix/strip-wsl-skills-audit
          fi
