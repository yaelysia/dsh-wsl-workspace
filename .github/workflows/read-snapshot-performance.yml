name: read-snapshot-performance
on:
  pull_request:
    paths:
      - 'src/fs.ts'
      - 'src/host/wsl-read-tool.ts'
      - 'src/host/variants.ts'
      - 'src/shared/native-files.ts'
      - 'src/shared/native-file-worker.ts'
      - 'src/shared/rpc-worker.ts'
      - 'src/shared/rpc-metrics.ts'
      - 'scripts/benchmark-read-snapshot.mjs'
      - 'tests/wsl-read-snapshot.test.mjs'
      - 'lib/**'
      - 'package.json'
      - '.github/workflows/read-snapshot-performance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            wsl: 0
          - os: windows-latest
            wsl: 2
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      WSL_COMPAT_DISTRO: Ubuntu-24.04
      MSYS_NO_PATHCONV: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: node ci/install-pinned.mjs
      - uses: Vampire/setup-wsl@v3
        if: matrix.wsl == 2
        with:
          distribution: Ubuntu-24.04
          additional-packages: python3
      - name: Verify Windows WSL2
        if: matrix.wsl == 2
        run: |
          mkdir -p logs
          current=$(wsl.exe -l -v | tr -d '\0\r' | sed 's/[[:space:]]*$//' | grep -F "$WSL_COMPAT_DISTRO" | grep -oE '[12]$' || true)
          if [ "$current" != 2 ]; then wsl.exe --set-version "$WSL_COMPAT_DISTRO" 2; fi
          wsl.exe -l -v | tr -d '\0\r' | tee logs/wsl-version.txt
          grep -F "$WSL_COMPAT_DISTRO" logs/wsl-version.txt | grep -E '[[:space:]]2$'
      - name: Upstream read-result parity and single-RPC contract (source and lib)
        run: |
          set -euo pipefail
          mkdir -p logs
          DSH_WSL_TEST_PLANE=src npm run test:read-snapshot > logs/read-src.txt 2>&1
          DSH_WSL_TEST_PLANE=lib npm run test:read-snapshot > logs/read-lib.txt 2>&1
          tail -10 logs/read-src.txt
          tail -10 logs/read-lib.txt
      - name: Paired registered host-read vs WSL fused-read
        run: |
          npm run bench:read-snapshot -- --iterations 20 --output logs/read-benchmark.json > logs/read-benchmark.log 2>&1
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs'
          const report=JSON.parse(readFileSync('logs/read-benchmark.json','utf8'))
          const result={platform:report.platform,iterations:report.iterations,head:report.head,
            before:{p50:report.before.wall.p50Ms,p95:report.before.wall.p95Ms,rpcs:report.before.calls[0]},
            after:{p50:report.after.wall.p50Ms,p95:report.after.wall.p95Ms,rpcs:report.after.calls[0]}}
          writeFileSync('logs/summary.json',JSON.stringify(result,null,2)+'\n')
          console.log(JSON.stringify(result,null,2))
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: read-snapshot-${{ matrix.os }}-wsl${{ matrix.wsl }}
          path: logs/
          retention-days: 14
