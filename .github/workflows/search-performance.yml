name: search-performance
on:
  pull_request:
    paths:
      - 'src/shared/search-*.ts'
      - 'src/host/wsl-search.ts'
      - 'scripts/benchmark-search*.mjs'
      - 'tests/search-prefilter.test.mjs'
      - 'tests/search-transport.test.mjs'
      - 'scripts/compatibility/search-real.mjs'
      - '.github/workflows/search-performance.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: search-performance-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  wsl2-native:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      WSL_COMPAT_DISTRO: Ubuntu-24.04
      WSL_COMPAT_DRIVE_PATH: ${{ github.workspace }}\tests
      MSYS_NO_PATHCONV: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Native transport tests need only Node, Linux Python and the bundled scripts.
      # Pinned DSH dependencies are installed later for the registered-tool checks.
      - uses: Vampire/setup-wsl@v3
        with:
          distribution: Ubuntu-24.04
          set-as-default: 'true'
          additional-packages: python3
      - name: Explicitly select WSL2 and record the kernel
        run: |
          wsl.exe --set-version "$WSL_COMPAT_DISTRO" 2
          mkdir -p logs
          wsl.exe -d "$WSL_COMPAT_DISTRO" -e uname -r > logs/kernel.txt
          cat logs/kernel.txt
      - name: Native prefilter correctness on Windows to WSL2
        run: node --experimental-strip-types --test tests/search-prefilter.test.mjs
      - name: Persistent transport lifecycle and native protocol
        run: node --experimental-strip-types --test tests/search-transport.test.mjs
      - name: Warmed script A/B (informational, no latency gate)
        run: |
          node --experimental-strip-types scripts/benchmark-search.mjs --files 1000 --iterations 10 > logs/search-benchmark.json
          cat logs/search-benchmark.json
      - name: Persistent vs oneshot transport A/B
        run: |
          node --experimental-strip-types scripts/benchmark-search-transport.mjs --files 1000 --iterations 30 > logs/transport-benchmark.json
          cat logs/transport-benchmark.json
      - name: Build and install the existing pinned host test dependencies
        run: |
          npm ci
          npm run build
          node ci/install-pinned.mjs
      - name: Registered search contracts with the persistent backend, source and lib
        env:
          DSH_WSL_TEST_SEARCH_TRANSPORT: persistent
        run: |
          node -e "if (!require('node:fs').statSync(process.env.WSL_COMPAT_DRIVE_PATH).isDirectory()) process.exit(1)"
          node --experimental-strip-types scripts/compatibility/search-real.mjs 2>&1 | tee logs/persistent-source.log
          DSH_WSL_TEST_PLANE=lib node --experimental-strip-types scripts/compatibility/search-real.mjs 2>&1 | tee logs/persistent-lib.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: search-performance-wsl2
          path: logs/
          if-no-files-found: ignore
          retention-days: 7
  linux-native:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --experimental-strip-types --test tests/search-transport.test.mjs
