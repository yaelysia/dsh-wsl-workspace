name: version-build-temp
on:
  push:
    branches: ['chore/bump-version-0.7.8']
    paths:
      - src/client/locales.ts
      - .github/workflows/version-build-temp.yml
permissions:
  contents: write
concurrency:
  group: version-build-temp-${ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: node ci/install-pinned.mjs
      - name: Build and test the matching client bundle
        run: |
          set -euo pipefail
          npm run build
          npm run test:unit
          npm run test:docs
          npm run typecheck:gate
      - name: Publish reproducible compiled lib assets to PR branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A lib
          if ! git diff --cached --quiet; then
            git commit -m 'build(release): sync 0.7.8 bilingual client bundle'
            git fetch origin refs/heads/chore/bump-version-0.7.8
            if ! git diff --quiet HEAD..FETCH_HEAD -- src package.json package-lock.json scripts tests; then
              echo 'Sources changed during build, refusing stale lib update'
              exit 1
            fi
            git rebase FETCH_HEAD
            git push origin HEAD:refs/heads/chore/bump-version-0.7.8
          fi
