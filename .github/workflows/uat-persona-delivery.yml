name: uat-persona-delivery
on:
  push:
    branches: [perf/phase4-native-files]
    paths: [.github/workflows/uat-persona-delivery.yml]
permissions:
  contents: read
jobs:
  assemble:
    if: contains(github.event.head_commit.message, '[uat-persona-build]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply hash-checked test changes
        run: |
          mkdir -p /tmp/uat-persona
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          def digest(data):
              return hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()
          p = Path('tests/persona-render.test.mjs')
          assert digest(p.read_bytes()) == '3ef0891752b8f348a89bd976d74bffdb8d1f3b5b'
          p = Path('tests/host-materialize.mjs')
          assert digest(p.read_bytes()) == '24b2ad0d335a340f1b2fe4d8dd2d99e3d53cd4e4'
          s = p.read_text().replace(r'Your working directory \{\{cwd\}\} is inside a WSL', r'Your working directory is inside a WSL')
          assert digest(s.encode()) == '0a46556357f763e213ceea2ae32c3f7d5dbf4651'
          p.write_text(s)
          p = Path('tests/variants.test.ts')
          assert digest(p.read_bytes()) == 'c2048582cae9c5c3dc7357daf265aa93f311252e'
          s = p.read_text().replace('Your working directory {{cwd}} is inside a WSL', 'Your working directory is inside a WSL')
          s = s.replace(r'Your working directory \{\{cwd\}\} is inside a WSL', r'Your working directory is inside a WSL')
          s = s.replace("test('legacy text personas keep the exact appended line they always had'", "test('legacy text personas retain host variables without adding a cwd dependency'")
          s = s.replace("  // Byte-for-byte what the pre-0.1.3 path produced: the block's own indentation\n  // plus the fragment's leading space.\n", "  // Preserve the host's text and indentation; only the plugin-owned note changes.\n  assert.ok(out.includes('directory is {{cwd}}.'), 'host-provided cwd is not rewritten')\n")
          s = s.replace("'legacy append unchanged'", "'legacy append keeps its indentation'")
          s += '''

          // Desktop 0.2.1-rc.2 registers provider/model, not cwd, in the deployment persona.
          // The adapter must not introduce a variable that the source never needed.
          for (const field of ['prefix', 'suffix', 'text']) {
            for (const block of [false, true]) {
              test(`WSL ${field} (${block ? 'block' : 'inline'}) introduces no prompt variables`, () => {
                const value = 'Model {{model}} from {{provider}}.'
                const source = `- id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              ${field}: ${block ? `>-\\n      ${value}` : value}
          `
                const out = transformPresetForWsl(source, SHELL, FS)
                assert.ok(out.includes('Your working directory is inside a WSL'))
                assert.ok(out.includes('file read/write/edit tools use Linux paths'))
                assert.deepEqual(out.match(/\\{\\{\\w+\\}\\}/g), source.match(/\\{\\{\\w+\\}\\}/g))
                assert.ok(!out.includes('{{cwd}}'))
              })
            }
          }
          '''
          assert digest(s.encode()) == '60edeac2ba5c94fa1a25227be159c87dbb46d7da'
          p.write_text(s)
          p = Path('package.json')
          assert digest(p.read_bytes()) == 'ef41cfb3691d3c425e447281bda2a14b932e5b27'
          data = json.loads(p.read_text())
          data['scripts']['test:persona'] = 'node --experimental-strip-types --test tests/persona-render.test.mjs'
          data['scripts']['test:node'] += ' && npm run test:persona'
          s = json.dumps(data, ensure_ascii=False, indent=2) + '\n'
          assert digest(s.encode()) == '06a701523cf5ddc4825be951e5790bafcb472722'
          p.write_text(s)
          PY
      - name: Regression must fail on the original source
        run: |
          if node --experimental-strip-types --test tests/variants.test.ts > /tmp/uat-persona/before.log 2>&1; then
            echo 'Expected the new regressions to fail before the source correction'
            exit 1
          fi
          tail -12 /tmp/uat-persona/before.log
      - name: Apply the minimal production correction
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          def digest(data):
              return hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()
          p = Path('src/host/variants.ts')
          assert digest(p.read_bytes()) == '49e855fd076bd021ae59b1a614f420f230eb9933'
          s = p.read_text().replace('/** The sentence appended to a standard-like persona when the variant runs in WSL. */', '''/**
           * Static WSL guidance: do not introduce runtime prompt variables. Newer hosts
           * provide cwd as runtime context, not a registered deployment-persona variable.
           * The source persona's own variables remain untouched.
           */''').replace('Your working directory {{cwd}} is inside a WSL', 'Your working directory is inside a WSL')
          assert digest(s.encode()) == 'eb9903ce94e6f4c6df696aec8f6dc8a56ea01ab2'
          p.write_text(s)
          PY
          git rm -- .uat-persona-change.b64
      - run: npm ci
      - name: Build and stage matching artifacts
        run: |
          npm run build 2>&1 | tee /tmp/uat-persona/build.log
          git add -- src/host/variants.ts tests/variants.test.ts tests/host-materialize.mjs package.json lib
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: remove undeclared cwd dependency from WSL personas and rebuild artifacts'
          npm run build >> /tmp/uat-persona/build.log 2>&1
          git diff --exit-code -- lib
          node scripts/verify-lib-sync.mjs
      - name: Portable and RPC checks
        run: |
          npm run test:unit 2>&1 | tee /tmp/uat-persona/unit.log
          npm run test:search-transport 2>&1 | tee /tmp/uat-persona/rpc.log
          npm run test:docs
          npm run test:docs-claims
          npm run test:matrix
      - run: node ci/install-pinned.mjs
      - name: Existing pinned host and native contracts
        run: |
          npm run test:persona 2>&1 | tee /tmp/uat-persona/persona-pinned.log
          npm run test:node 2>&1 | tee /tmp/uat-persona/host.log
          npm run test:native-files 2>&1 | tee /tmp/uat-persona/native-source.log
          DSH_WSL_TEST_PLANE=lib npm run test:native-files 2>&1 | tee /tmp/uat-persona/native-lib.log
          npm run typecheck:gate
          npm run test:seams
          npm run verify:install
      - name: Actual reported host version, isolated from existing pins
        run: |
          host_root="$RUNNER_TEMP/persona-host"
          npm install --prefix "$host_root" --ignore-scripts --legacy-peer-deps --no-audit --no-fund @deepseek-ai/dsh@0.2.1-rc.2 @deepseek-ai/dsh-scope@0.2.1-rc.2
          DSH_WSL_PROMPT_HOST_DIR="$host_root" DSH_WSL_PROMPT_EXPECT_VERSION=0.2.1-rc.2 npm run test:persona 2>&1 | tee /tmp/uat-persona/persona-desktop-version.log
      - name: Publish only the tested feature commit
        run: |
          git diff --exit-code
          git rev-parse HEAD | tee /tmp/uat-persona/commit.txt
          git archive --format=tar HEAD > /tmp/uat-persona/source.tar
          git push origin HEAD:refs/heads/perf/phase4-native-files
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uat-persona-validation
          path: /tmp/uat-persona/
          retention-days: 14
