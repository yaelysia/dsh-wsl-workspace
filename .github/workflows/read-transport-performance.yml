name: read-transport-performance
on:
  pull_request:
    paths:
      - 'src/shared/native-file-worker.ts'
      - 'src/shared/native-files.ts'
      - 'src/shared/rpc-worker.ts'
      - 'src/shared/rpc-transport.ts'
      - 'scripts/benchmark-large-read-transport.mjs'
      - 'tests/native-read-compression.test.mjs'
      - 'lib/**'
      - 'package.json'
      - '.github/workflows/read-transport-performance.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: read-transport-${ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  paired:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            wsl: 0
          - os: windows-latest
            wsl: 2
    runs-on: ${ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      WSL_COMPAT_DISTRO: Ubuntu-24.04
      MSYS_NO_PATHCONV: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: node ci/install-pinned.mjs
      - uses: Vampire/setup-wsl@v3
        if: matrix.wsl == 2
        with:
          distribution: Ubuntu-24.04
          additional-packages: python3
      - name: Verify actual Windows WSL2, not WSL1
        if: matrix.wsl == 2
        run: |
          mkdir -p logs
          current=$(wsl.exe -l -v | tr -d '\0\r' | sed 's/[[:space:]]*$//' | grep -F "$WSL_COMPAT_DISTRO" | grep -oE '[12]$' || true)
          if [ "$current" != 2 ]; then wsl.exe --set-version "$WSL_COMPAT_DISTRO" 2; fi
          wsl.exe -l -v | tr -d '\0\r' | tee logs/wsl-version.txt
          grep -F "$WSL_COMPAT_DISTRO" logs/wsl-version.txt | grep -E '[[:space:]]2$'
      - name: Real source and committed lib adaptive read contracts
        run: |
          set -euo pipefail
          mkdir -p logs
          DSH_WSL_TEST_PLANE=src npm run test:read-transport > logs/read-transport-src.txt 2>&1
          DSH_WSL_TEST_PLANE=lib npm run test:read-transport > logs/read-transport-lib.txt 2>&1
          tail -10 logs/read-transport-src.txt
          tail -10 logs/read-transport-lib.txt
      - name: Paired native read provider versus merged CP18 baseline
        run: |
          set -euo pipefail
          git worktree add --detach .cp19-baseline a11073dbad8bd1a54cce7cf62f9e8dc04735b450
          node -e "require('node:fs').symlinkSync(require('node:path').resolve('node_modules'), '.cp19-baseline/node_modules', process.platform === 'win32' ? 'junction' : 'dir')"
          npm run bench:read-transport -- --baseline .cp19-baseline --iterations 20 --output logs/read-transport-benchmark.json > logs/read-transport-benchmark.log 2>&1
          node --input-type=module <<'NODE'
          import { readFileSync,writeFileSync } from 'node:fs'
          const r=JSON.parse(readFileSync('logs/read-transport-benchmark.json'))
          const rows=r.rows.map(row=>({
            scenario:row.scenario,bytes:row.fileBytes,
            beforeP50:row.before.wall.p50Ms,afterP50:row.after.wall.p50Ms,
            beforeP95:row.before.wall.p95Ms,afterP95:row.after.wall.p95Ms,
            beforeWire:row.before.stdoutBytes[0],afterWire:row.after.stdoutBytes[0],
            beforeDecoded:row.before.decodedReceiptBytes[0],afterDecoded:row.after.decodedReceiptBytes[0],
            beforeCalls:row.before.rpcCounts[0],afterCalls:row.after.rpcCounts[0]
          }))
          const summary={platform:r.platform,baselineSha:r.baselineSha,iterations:r.iterations,rows,pools:r.pools}
          writeFileSync('logs/read-transport-summary.json',JSON.stringify(summary,null,2)+'\n')
          console.log(JSON.stringify(summary,null,2))
          NODE
          git worktree remove --force .cp19-baseline
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adaptive-read-${ matrix.os }}-wsl${ matrix.wsl }}
          path: logs/
          retention-days: 14
