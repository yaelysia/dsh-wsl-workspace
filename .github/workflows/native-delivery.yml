name: native-delivery
on:
  push:
    branches: [perf/phase4-native-files]
    paths: [.github/workflows/native-delivery.yml, '.native-part*']
permissions:
  contents: read
jobs:
  assemble:
    if: contains(github.event.head_commit.message, '[native-build]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply checksum-verified native implementation
        run: |
          python3 - <<'PY'
          import gzip, hashlib, subprocess
          from pathlib import Path
          parts=[Path(f'.native-part{i}').read_bytes() for i in range(4)]
          expected=['5ebb7a62668e385d12fa72e21807baa0745169ef','bf482623be59cbc8b8b10ea774d100fb50ae1acb','c6965956e9852df50b83482e254587c9709ab84e','115e3358e035e43527ed1b7eaf0130a682f2920b']
          for p,s in zip(parts,expected):
              assert hashlib.sha1(b'blob '+str(len(p)).encode()+b'\0'+p).hexdigest()==s
          patch=gzip.decompress(b''.join(parts))
          assert hashlib.sha256(patch).hexdigest()=='9b12fad536f47f0892a272e00340d07ffdf8bf29a0c683727cdb4f0fdc75be87'
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          PY
          git rm -- .native-part0 .native-part1 .native-part2 .native-part3
      - run: npm ci
      - name: Build and stage exact distributable
        run: |
          mkdir -p /tmp/native-build
          npm run build 2>&1 | tee /tmp/native-build/build.log
          git add -- lib
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: native WSL file transactions with guarded writes and shared RPC'
          npm run build >> /tmp/native-build/build.log 2>&1
          git diff --exit-code -- lib
          node scripts/verify-lib-sync.mjs
      - name: Portable and RPC regression checks
        run: |
          npm run test:unit 2>&1 | tee /tmp/native-build/unit.log
          npm run test:search-transport 2>&1 | tee /tmp/native-build/rpc.log
          npm run test:search-prefilter
      - run: node ci/install-pinned.mjs
      - name: Native file, host and installation checks
        run: |
          npm run test:native-files 2>&1 | tee /tmp/native-build/native-source.log
          DSH_WSL_TEST_PLANE=lib npm run test:native-files 2>&1 | tee /tmp/native-build/native-lib.log
          npm run test:node 2>&1 | tee /tmp/native-build/host.log
          npm run typecheck:gate 2>&1 | tee /tmp/native-build/types.log
          npm run test:seams
          npm run verify:install
      - name: Publish only tested feature commit
        run: |
          git diff --exit-code
          npm pack --ignore-scripts --pack-destination /tmp/native-build
          git archive --format=tar HEAD > /tmp/native-build/source.tar
          git rev-parse HEAD | tee /tmp/native-build/commit.txt
          git push origin HEAD:refs/heads/perf/phase4-native-files
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-files-build
          path: /tmp/native-build/
          retention-days: 7
