name: native-delivery
on:
  push:
    branches: [perf/phase4-native-files]
    paths: [.github/workflows/native-delivery.yml, '.native-finish-*']
permissions:
  contents: read
jobs:
  assemble:
    if: contains(github.event.head_commit.message, '[native-build]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Materialize checksum-verified documentation and regression fixes
        run: |
          python3 - <<'PY'
          import gzip, hashlib, json, subprocess
          from pathlib import Path
          data = gzip.decompress(b''.join(Path(f'.native-finish-{i}').read_bytes() for i in range(11)))
          assert hashlib.sha256(data).hexdigest() == 'a767612b43762df72e7d7cf24ec48d90a754f6d20791dd5340ab4aa43329c4dc', 'transport checksum mismatch'
          files = json.loads(data)
          for item in files:
              path = Path(item['path'])
              assert not path.is_absolute() and '..' not in path.parts and '.git' not in path.parts
              old = path.read_bytes() if path.exists() else b''
              assert hashlib.sha256(old).hexdigest() == item['before'], f'base mismatch: {path}'
              text = old.decode('utf-8')
              new = ''.join(text[op[0]:op[1]] if isinstance(op, list) else op for op in item['ops']).encode('utf-8')
              assert hashlib.sha256(new).hexdigest() == item['after'], f'result mismatch: {path}'
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(new)
          subprocess.run(['git', 'add', '--', *[item['path'] for item in files]], check=True)
          PY
          git rm -- .native-finish-*
      - run: npm ci
      - name: Build and stage the exact distributable
        run: |
          mkdir -p /tmp/native-finish
          npm run build 2>&1 | tee /tmp/native-finish/build.log
          git add -- lib
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: validate native file parity on the host substrate and finish fork documentation'
          npm run build >> /tmp/native-finish/build.log 2>&1
          git diff --exit-code -- lib
          node scripts/verify-lib-sync.mjs
      - name: Portable, RPC and documentation regressions
        run: |
          npm run test:unit 2>&1 | tee /tmp/native-finish/unit.log
          npm run test:search-transport 2>&1 | tee /tmp/native-finish/rpc.log
          npm run test:search-prefilter
          npm run test:docs
          npm run test:docs-claims
          npm run test:matrix
      - run: node ci/install-pinned.mjs
      - name: Native file contracts and host integration
        run: |
          npm run test:native-files 2>&1 | tee /tmp/native-finish/native-source.log
          DSH_WSL_TEST_PLANE=lib npm run test:native-files 2>&1 | tee /tmp/native-finish/native-lib.log
          npm run test:node 2>&1 | tee /tmp/native-finish/host.log
          npm run typecheck:gate 2>&1 | tee /tmp/native-finish/types.log
          npm run test:seams
          npm run verify:install
      - name: Publish only the tested feature commit
        run: |
          git diff --exit-code
          npm pack --ignore-scripts --pack-destination /tmp/native-finish
          git archive --format=tar HEAD > /tmp/native-finish/source.tar
          git rev-parse HEAD | tee /tmp/native-finish/commit.txt
          git push origin HEAD:refs/heads/perf/phase4-native-files
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-files-finished-build
          path: /tmp/native-finish/
          retention-days: 7
