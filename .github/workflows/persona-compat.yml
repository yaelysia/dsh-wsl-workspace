name: persona-compatibility
on:
  pull_request:
    paths:
      - 'src/host/variants.ts'
      - 'src/index.ts'
      - 'lib/index.js'
      - 'tests/persona-render.test.mjs'
      - 'tests/variants.test.ts'
      - 'package.json'
      - '.github/workflows/persona-compat.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: persona-compat-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  render:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: node ci/install-pinned.mjs
      - name: Existing pinned renderer, generated source and committed lib
        env:
          DSH_WSL_PROMPT_EXPECT_VERSION: 0.2.0-rc.2
        run: npm run test:persona
      - name: Reported Desktop renderer, isolated umbrella tree
        run: |
          host_root=$(node -p 'require("node:path").join(process.env.RUNNER_TEMP, "persona-host")')
          npm install --prefix "$host_root" --ignore-scripts --legacy-peer-deps --no-audit --no-fund @deepseek-ai/dsh@0.2.1-rc.2 @deepseek-ai/dsh-scope@0.2.1-rc.2
          DSH_WSL_PROMPT_HOST_DIR="$host_root" DSH_WSL_PROMPT_EXPECT_VERSION=0.2.1-rc.2 npm run test:persona
