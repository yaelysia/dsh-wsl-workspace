name: wildcard-anchor-performance
on:
  pull_request:
    paths:
      - 'src/shared/search-patterns.ts'
      - 'src/shared/search-scripts.ts'
      - 'src/host/wsl-search.ts'
      - 'tests/grep-prune.test.mjs'
      - 'scripts/benchmark-wildcard-anchor.mjs'
      - 'lib/**'
      - 'package.json'
      - '.github/workflows/wildcard-anchor-performance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measured:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            wsl: 0
          - os: windows-latest
            wsl: 2
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      WSL_COMPAT_DISTRO: Ubuntu-24.04
      MSYS_NO_PATHCONV: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: node ci/install-pinned.mjs
      - uses: Vampire/setup-wsl@v3
        if: matrix.wsl == 2
        with:
          distribution: Ubuntu-24.04
          additional-packages: python3
      - name: Require actual Windows WSL2
        if: matrix.wsl == 2
        run: |
          mkdir -p logs
          current=$(wsl.exe -l -v | tr -d '\0\r' | sed 's/[[:space:]]*$//' | grep -F "$WSL_COMPAT_DISTRO" | grep -oE '[12]$' || true)
          if [ "$current" != 2 ]; then wsl.exe --set-version "$WSL_COMPAT_DISTRO" 2; fi
          wsl.exe -l -v | tr -d '\0\r' | tee logs/wsl-version.txt
          grep -F "$WSL_COMPAT_DISTRO" logs/wsl-version.txt | grep -E '[[:space:]]2$'
      - name: Registered and direct search contracts: source and built artifact
        run: |
          set -euo pipefail
          mkdir -p logs
          DSH_WSL_TEST_PLANE=src npm run test:grep-prune > logs/anchor-src.txt 2>&1
          DSH_WSL_TEST_PLANE=lib npm run test:grep-prune > logs/anchor-lib.txt 2>&1
          tail -8 logs/anchor-src.txt
          tail -8 logs/anchor-lib.txt
      - name: Paired registered wildcard grep and glob performance
        run: |
          git worktree add --detach .cp17-baseline 053a71a5941c9bcec51a8e371c31aa279087ad36
          node -e "require('node:fs').symlinkSync(require('node:path').resolve('node_modules'), '.cp17-baseline/node_modules', process.platform === 'win32' ? 'junction' : 'dir')"
          npm run bench:wildcard-anchor -- --baseline .cp17-baseline --iterations 20 --output logs/anchor-bench.json > logs/anchor-bench.txt 2>&1
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const report=JSON.parse(readFileSync('logs/anchor-bench.json'))
          console.log(JSON.stringify({platform:report.platform,base:report.baselineSha,
            rows:report.rows.map(x=>({op:x.operation,scenario:x.scenario,
              beforeP50:x.before.p50Ms,afterP50:x.after.p50Ms,
              beforeP95:x.before.p95Ms,afterP95:x.after.p95Ms,
              decodedRpcStdoutBytes:x.decodedRpcStdoutBytes,matchCount:x.matchCount}))},null,2))
          NODE
          git worktree remove --force .cp17-baseline
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wildcard-anchor-${{ matrix.os }}-wsl${{ matrix.wsl }}
          path: logs/
          retention-days: 14
