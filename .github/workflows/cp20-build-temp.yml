name: cp20-build-temp
on:
  push:
    branches: ['perf/cp20-native-read-window']
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/cp20-build-temp.yml'
permissions:
  contents: write
concurrency:
  group: cp20-build-temp-${ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.repository == 'yaelysia/dsh-wsl-workspace'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: node ci/install-pinned.mjs
      - name: Build matching source and shipped library
        run: npm run build
      - name: Both planes and existing file/Loader protections
        run: |
          set -euo pipefail
          for plane in src lib; do
            export DSH_WSL_TEST_PLANE=$plane
            npm run test:read-window
            npm run test:read-snapshot
            npm run test:rpc-loader
            npm run test:native-files
          done
          npm run test:unit
          npm run test:docs
          npm run typecheck:gate
          npm run test:version -- --base 2cf4604d1b516a1036488c1c1220d525d4b9e12b
      - name: Commit only verified and reproducible built artifacts
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A lib
          if ! git diff --cached --quiet; then
            git commit -m 'build(cp20): synchronize tested 0.7.9 native read library'
            git fetch origin refs/heads/perf/cp20-native-read-window
            if ! git diff --quiet HEAD..FETCH_HEAD -- src package.json package-lock.json scripts tests; then
              echo 'Source changed during build, refusing stale lib push'
              exit 1
            fi
            git rebase FETCH_HEAD
            git push origin HEAD:refs/heads/perf/cp20-native-read-window
          fi
