name: cp20-build-temp
on:
  push:
    branches: ['perf/cp20-native-read-window']
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/cp20-build-temp.yml'
permissions:
  contents: write
concurrency:
  group: cp20-build-temp-${ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.repository == 'yaelysia/dsh-wsl-workspace'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: node ci/install-pinned.mjs
      - name: Build current independently named package and verify both planes
        run: |
          set -euo pipefail
          npm run build
          for plane in src lib; do
            export DSH_WSL_TEST_PLANE=$plane
            npm run test:read-window
            npm run test:read-snapshot
            npm run test:rpc-loader
            npm run test:native-files
          done
          npm run test:unit
          npm run test:docs
          npm run typecheck:gate
          npm run test:version -- --base 368a242f8523c555c6d77a9120fae50b37448d2d
      - name: Commit rebuilt library only after verified parity
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A lib
          if ! git diff --cached --quiet; then
            git commit -m 'build(cp20): compile validated 0.7.10 enhanced plugin library'
            git fetch origin refs/heads/perf/cp20-native-read-window
            if ! git diff --quiet HEAD..FETCH_HEAD -- src package.json package-lock.json scripts tests; then
              echo 'Source changed during build, refusing stale lib publication'
              exit 1
            fi
            git rebase FETCH_HEAD
            git push origin HEAD:refs/heads/perf/cp20-native-read-window
          fi
