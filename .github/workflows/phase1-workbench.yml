name: phase1-workbench
on:
  push:
    branches: [perf/phase1-workspace-tools]
permissions:
  contents: read
concurrency:
  group: phase1-workbench
  cancel-in-progress: false
jobs:
  assemble:
    if: contains(github.event.head_commit.message, '[phase1-build]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.publish.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply the validated phase-one changeset
        shell: bash
        run: |
          python3 - <<'PY'
          import gzip, hashlib, subprocess
          from pathlib import Path
          data = gzip.decompress(b''.join(Path(f'.phase1-patch.{i}').read_bytes() for i in range(4)))
          assert hashlib.sha256(data).hexdigest() == '3b47e795fdc13ecca6bdce3e4edae79df7cfc39463c58e47d3d9d22a67665744', 'changeset checksum mismatch'
          subprocess.run(['git', 'apply', '--check', '-'], input=data, check=True)
          subprocess.run(['git', 'apply', '--index', '-'], input=data, check=True)
          PY
      - run: npm ci
      - name: Build the exact distributable and stage its source
        shell: bash
        run: |
          npm run build
          git add -- lib
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'perf: bound skill monitors and prefilter WSL searches with regression coverage'
          npm run build
          git diff --exit-code -- lib
          node scripts/verify-lib-sync.mjs
      - name: Portable unit and native search regressions
        shell: bash
        run: |
          npm run test:unit
          npm run test:search-prefilter
          node --experimental-strip-types --test --test-name-pattern='eviction retires|invalidated catalogs|a poll completing|a lookup completing' tests/wsl-skills.test.ts
      - name: Documentation and compatibility ledger checks
        shell: bash
        run: |
          npm run test:docs
          npm run test:docs-claims
          npm run test:matrix
      - name: Install the existing pinned host dependencies
        run: node ci/install-pinned.mjs
      - name: Host integration and type checks
        shell: bash
        run: |
          npm run test:node
          npm run typecheck:gate
          npm run test:seams
      - name: Record Linux control and package the built plugin
        shell: bash
        run: |
          mkdir -p /tmp/phase1-artifacts
          npm run --silent bench:search -- --files 1000 --iterations 10 > /tmp/phase1-artifacts/search-benchmark-linux.json
          npm pack --ignore-scripts --pack-destination /tmp/phase1-artifacts
      - name: Publish only the tested feature commit (no force push)
        id: publish
        shell: bash
        run: |
          git push origin HEAD:refs/heads/perf/phase1-workspace-tools
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git archive --format=tar HEAD > /tmp/phase1-artifacts/source.tar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase1-linux-validation
          path: /tmp/phase1-artifacts/
          if-no-files-found: ignore
          retention-days: 7
  windows:
    needs: assemble
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      WSL_COMPAT_DISTRO: Ubuntu-24.04
      WSL_COMPAT_USER: root
      WSL_COMPAT_DRIVE_PATH: ${{ github.workspace }}\tests
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.assemble.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node ci/install-pinned.mjs
      - uses: Vampire/setup-wsl@v3
        with:
          wsl-version: 2
          distribution: Ubuntu-24.04
          set-as-default: 'true'
          systemd: 'false'
          use-headless: 'false'
      - name: Windows semantics and native search regressions
        run: |
          npm run test:win32
          npm run test:search-prefilter
      - name: Full registered search tools, source and built artifact
        run: |
          node --experimental-strip-types scripts/compatibility/search-real.mjs
          DSH_WSL_TEST_PLANE=lib node --experimental-strip-types scripts/compatibility/search-real.mjs
      - name: Record warmed Windows to WSL2 benchmark
        run: |
          mkdir -p logs
          npm run --silent bench:search -- --files 1000 --iterations 10 > logs/search-benchmark.json
          cat logs/search-benchmark.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase1-windows-validation
          path: logs/
          if-no-files-found: ignore
          retention-days: 7
