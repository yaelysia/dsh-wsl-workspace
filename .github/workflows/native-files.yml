name: native-files
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-files-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  linux-native:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: node ci/install-pinned.mjs
      - name: Source and committed artifact file contracts
        shell: bash
        run: |
          set -o pipefail
          mkdir -p logs
          npm run test:native-files 2>&1 | tee logs/native-source.log
          DSH_WSL_TEST_PLANE=lib npm run test:native-files 2>&1 | tee logs/native-lib.log
          npm run test:search-transport
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-files-linux
          path: logs/
          retention-days: 7
  windows-native:
    strategy:
      fail-fast: false
      matrix:
        wsl: [1, 2]
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      WSL_COMPAT_DISTRO: Ubuntu-24.04
      WSL_COMPAT_DRIVE_PATH: ${{ github.workspace }}\tests
      MSYS_NO_PATHCONV: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: node ci/install-pinned.mjs
      - uses: Vampire/setup-wsl@v3
        with:
          distribution: Ubuntu-24.04
          set-as-default: 'true'
          additional-packages: python3
      - name: Select and record actual WSL version
        run: |
          wsl.exe --set-version "$WSL_COMPAT_DISTRO" ${{ matrix.wsl }}
          mkdir -p logs
          wsl.exe -d "$WSL_COMPAT_DISTRO" -e uname -r > logs/kernel.txt
          cat logs/kernel.txt
      - name: Native file contracts, source and committed lib
        run: |
          set -o pipefail
          npm run test:native-files 2>&1 | tee logs/native-source.log
          DSH_WSL_TEST_PLANE=lib npm run test:native-files 2>&1 | tee logs/native-lib.log
      - name: Full provider A/B against UNC (informational, not a latency gate)
        run: node --experimental-strip-types scripts/benchmark-native-files.mjs --iterations 20 --output logs/native-benchmark.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-files-wsl${{ matrix.wsl }}
          path: logs/
          if-no-files-found: warn
          retention-days: 7
