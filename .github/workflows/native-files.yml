name: native-files
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-files-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  linux-native:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: node ci/install-pinned.mjs
      - name: Source and committed artifact file and lifecycle contracts
        shell: bash
        run: |
          set -o pipefail
          mkdir -p logs
          for plane in src lib; do
            export DSH_WSL_TEST_PLANE=$plane
            npm run test:native-files 2>&1 | tee logs/native-$plane.log
            npm run test:rpc-owner 2>&1 | tee logs/owner-$plane.log
            npm run test:rpc-mixed 2>&1 | tee logs/mixed-$plane.log
            npm run test:rpc-loader 2>&1 | tee logs/loader-$plane.log
            npm run test:rpc-busy 2>&1 | tee logs/busy-$plane.log
          done
          npm run test:search-transport
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-files-linux
          path: logs/
          retention-days: 14
  windows-native:
    strategy:
      fail-fast: false
      matrix:
        wsl: [1, 2]
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      WSL_COMPAT_DISTRO: Ubuntu-24.04
      WSL_COMPAT_DRIVE_PATH: ${{ github.workspace }}\tests
      MSYS_NO_PATHCONV: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: node ci/install-pinned.mjs
      - uses: Vampire/setup-wsl@v3
        with:
          distribution: Ubuntu-24.04
          set-as-default: 'true'
          additional-packages: python3
      - name: Select and record actual WSL version
        run: |
          mkdir -p logs
          want=${{ matrix.wsl }}
          # Converting an already WSL1 instance can report VM_MODE_INVALID_STATE.
          current=$(wsl.exe -l -v 2>/dev/null | tr -d '\0\r' | sed 's/[[:space:]]*$//' | grep -F "$WSL_COMPAT_DISTRO" | grep -oE '[12]$' || true)
          if [ "$current" != "$want" ]; then
            wsl.exe --set-version "$WSL_COMPAT_DISTRO" "$want"
          fi
          wsl.exe -l -v 2>/dev/null | tr -d '\0\r' | sed 's/[[:space:]]*$//' | tee logs/distributions.txt
          grep -F "$WSL_COMPAT_DISTRO" logs/distributions.txt | grep -E "[[:space:]]${want}$"
          wsl.exe -d "$WSL_COMPAT_DISTRO" -e uname -r > logs/kernel.txt
          cat logs/kernel.txt
      - name: Native files, owner reuse, mixed cancellation and real busy lifetime
        run: |
          set -o pipefail
          for plane in src lib; do
            export DSH_WSL_TEST_PLANE=$plane
            npm run test:native-files 2>&1 | tee logs/native-$plane.log
            npm run test:rpc-owner 2>&1 | tee logs/owner-$plane.log
            npm run test:rpc-mixed 2>&1 | tee logs/mixed-$plane.log
            npm run test:rpc-loader 2>&1 | tee logs/loader-$plane.log
            npm run test:rpc-busy 2>&1 | tee logs/busy-$plane.log
          done
      - name: Full provider A/B against UNC (informational, not a latency gate)
        run: node --experimental-strip-types scripts/benchmark-native-files.mjs --iterations 20 --output logs/native-benchmark.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-files-wsl${{ matrix.wsl }}
          path: logs/
          if-no-files-found: warn
          retention-days: 14
