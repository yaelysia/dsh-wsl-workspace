name: cp13-delivery
on:
  push:
    branches: [perf/cp13-native-io]
    paths: [.ci-cp13-apply.mjs, scripts/benchmark-native-rpc.mjs, .github/workflows/cp13-delivery.yml]
permissions:
  contents: write
concurrency:
  group: cp13-delivery
  cancel-in-progress: true
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: node ci/install-pinned.mjs
      - name: Baseline contract and reviewed changes
        run: |
          mkdir -p logs
          node --check .ci-cp13-apply.mjs
          node --check scripts/benchmark-native-rpc.mjs
          npm run test:search-transport > logs/baseline-rpc.log 2>&1
          node .ci-cp13-apply.mjs
          npm run build
      - name: Behaviour and artifact gates
        run: |
          set -o pipefail
          npm run test:unit > logs/unit.log 2>&1
          npm run test:node > logs/host.log 2>&1
          npm run test:search-transport 2>&1 | tee logs/rpc.log
          for plane in src lib; do
            export DSH_WSL_TEST_PLANE=$plane
            npm run test:native-files 2>&1 | tee logs/native-$plane.log
            npm run test:rpc-loader 2>&1 | tee logs/loader-$plane.log
            npm run test:rpc-owner 2>&1 | tee logs/owner-$plane.log
            npm run test:rpc-mixed 2>&1 | tee logs/mixed-$plane.log
          done
          npm run typecheck:gate > logs/types.log 2>&1
          npm run test:docs > logs/docs.log 2>&1
          npm run test:docs-claims > logs/claims.log 2>&1
          npm run verify:install > logs/install.log 2>&1
      - name: Alternating real native providers and isolated microbenchmarks
        env:
          DSH_WSL_TEST_PLANE: src
        run: |
          set -o pipefail
          git worktree add --detach .cp13-baseline 30b9abf7496d818c1f43a69ee50745e924e8a37a
          node -e "require('node:fs').symlinkSync(require('node:path').resolve('node_modules'), '.cp13-baseline/node_modules', 'dir')"
          npm run bench:native-rpc -- --baseline .cp13-baseline --iterations 16 --output logs/performance-linux.json 2>&1 | tee logs/performance-linux.log
          git worktree remove --force .cp13-baseline
      - name: Retain exact measured summary
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          const result = JSON.parse(readFileSync('logs/performance-linux.json'))
          const summary = { ...result, pools: Object.fromEntries(Object.entries(result.pools).map(([name, state]) => [name,
            { workers: state.workers, launches: state.launches, pending: state.pending, fallbacks: state.fallbacks }])) }
          writeFileSync('docs/performance-cp13-linux.json', JSON.stringify(summary, null, 2) + '\n')
          let text = readFileSync('docs/performance-cp13.md', 'utf8')
          text += '\n## First measured Linux result\n\nActual baseline: `' + result.baselineSha + '`. Node `' + result.node + '`, platform `' + result.platform + '`. Each row has ' + result.iterations + ' samples per backend after two warm-ups, in alternating order. See [raw readings](performance-cp13-linux.json). This is Linux native-RPC execution, not a Windows or Desktop timing claim.\n\n| Bytes | Operation | Before P50 / P95 ms | After P50 / P95 ms |\n|---:|---|---:|---:|\n'
          for (const row of result.rows) text += `| ${row.bytes} | ${row.operation} | ${row.before.p50Ms} / ${row.before.p95Ms} | ${row.after.p50Ms} / ${row.after.p95Ms} |\n`
          writeFileSync('docs/performance-cp13.md', text)
          NODE
          npm run test:docs
      - name: Publish tested source and matching lib with a branch lease
        env:
          BRANCH: perf/cp13-native-io
        run: |
          git diff --check
          git add src lib tests package.json CHECKPOINT.md docs/performance-cp13.md docs/performance-cp13-linux.json
          npm run build
          git diff --exit-code -- lib
          git fetch origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'perf: reduce native file and RPC allocation overhead with paired measurements'
          git push origin "HEAD:$BRANCH"
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cp13-delivery-logs
          path: logs/
          retention-days: 14
