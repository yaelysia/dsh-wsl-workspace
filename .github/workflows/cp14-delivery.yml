name: cp14-delivery
on:
  push:
    branches: [perf/cp14-prune-enumeration]
    paths: ['.ci-cp14-apply.mjs', '.github/workflows/cp14-delivery.yml', 'tests/traversal-performance.test.mjs', 'scripts/benchmark-traversal.mjs']
permissions:
  contents: write
concurrency:
  group: cp14-delivery
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: node ci/install-pinned.mjs
      - name: Check baseline and apply the reviewed transform
        run: |
          mkdir -p logs
          npm run test:unit > logs/baseline-unit.log 2>&1
          npm run test:search-prefilter > logs/baseline-prefilter.log 2>&1
          node --check .ci-cp14-apply.mjs
          node .ci-cp14-apply.mjs
      - name: Build, actual execution and unchanged behavior contracts
        run: |
          set -o pipefail
          npm run build 2>&1 | tee logs/build.log
          npm run test:traversal 2>&1 | tee logs/traversal-src.log
          DSH_WSL_TEST_PLANE=lib npm run test:traversal 2>&1 | tee logs/traversal-lib.log
          npm run test:unit > logs/unit.log 2>&1
          npm run test:node > logs/node.log 2>&1
          npm run test:search-transport > logs/rpc.log 2>&1
          npm run test:native-files > logs/native-src.log 2>&1
          DSH_WSL_TEST_PLANE=lib npm run test:native-files > logs/native-lib.log 2>&1
          DSH_WSL_TEST_PLANE=lib npm run test:rpc-loader > logs/loader-lib.log 2>&1
          npm run typecheck:gate > logs/types.log 2>&1
          npm run test:docs > logs/docs.log 2>&1
          npm run test:docs-claims > logs/docs-claims.log 2>&1
          npm run verify:install > logs/install.log 2>&1
          git add src lib tests package.json scripts/benchmark-traversal.mjs CHECKPOINT.md docs/performance-cp14.md
          npm run build > logs/rebuild.log 2>&1
          git diff --exit-code -- lib
      - name: Paired real tools and native provider measurements
        run: |
          git worktree add --detach .cp14-baseline f7c051a05c279bec181a2ef0257d6b4240fc9ad4
          node -e "require('node:fs').symlinkSync(require('node:path').resolve('node_modules'), '.cp14-baseline/node_modules', 'dir')"
          npm run bench:traversal -- --baseline .cp14-baseline --iterations 20 --output logs/performance.json > logs/benchmark.log 2>&1
          cp logs/performance.json docs/performance-cp14-linux.json
          node --input-type=module <<'NODE'
          import {readFileSync,appendFileSync} from 'node:fs'
          const r=JSON.parse(readFileSync('logs/performance.json'))
          const table=r.rows.map(x=>`| ${x.operation} | ${x.before.p50Ms} / ${x.before.p95Ms} | ${x.after.p50Ms} / ${x.after.p95Ms} |`).join('\n')
          const text='\n## First completed Linux measurements\n\n20 alternating samples per backend after warm-up; milliseconds. Full raw readings are in [Linux JSON](performance-cp14-linux.json). These are native Linux, not Windows or Desktop timings.\n\n| Operation | CP13 P50 / P95 | CP14 P50 / P95 |\n|---|---:|---:|\n'+table+'\n\nReal metadata calls: `'+JSON.stringify(r.workCounts)+'`.\n'
          appendFileSync('docs/performance-cp14.md',text)
          console.log(JSON.stringify(r,null,2))
          NODE
          git worktree remove --force .cp14-baseline
      - name: Publish tested source and matching lib with a branch lease
        run: |
          test "$(git ls-remote origin refs/heads/perf/cp14-prune-enumeration | cut -f1)" = "$GITHUB_SHA"
          git add src lib tests package.json scripts/benchmark-traversal.mjs CHECKPOINT.md docs/performance-cp14.md docs/performance-cp14-linux.json
          if git diff --cached --name-only | grep -vE '^(src/|lib/|tests/|package.json$|scripts/benchmark-traversal.mjs$|CHECKPOINT.md$|docs/performance-cp14)'; then exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'perf: prune fixed-prefix glob traversal and reuse directory descriptors'
          git push origin HEAD:refs/heads/perf/cp14-prune-enumeration
          test "$(git ls-remote origin refs/heads/perf/cp14-prune-enumeration | cut -f1)" = "$(git rev-parse HEAD)"
          git rev-parse HEAD | tee logs/published-sha.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cp14-delivery-logs
          path: logs/
          retention-days: 14
