name: simplify-delivery
on:
  push:
    branches: [refactor/simplify-rpc-files]
permissions:
  contents: write
concurrency:
  group: simplify-delivery
  cancel-in-progress: false
jobs:
  deliver:
    if: contains(github.event.head_commit.message, '[simplify-build]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: node ci/install-pinned.mjs
      - name: Baseline and exact reviewed source transform
        shell: bash
        run: |
          set -o pipefail
          mkdir -p logs
          npm run test:unit 2>&1 | tee logs/baseline-unit.log
          npm run test:search-transport 2>&1 | tee logs/baseline-rpc.log
          node .ci-simplify.mjs | tee logs/changes.jsonl
          git diff --stat | tee logs/diff-stat.txt
          git diff -- src tests CHECKPOINT.md > logs/reviewed.diff
      - name: Build and behaviour gates
        shell: bash
        run: |
          set -o pipefail
          npm run build > logs/build.log 2>&1
          npm run test:unit 2>&1 | tee logs/unit.log
          npm run test:node 2>&1 | tee logs/host.log
          npm run test:search-transport 2>&1 | tee logs/rpc.log
          for plane in src lib; do
            export DSH_WSL_TEST_PLANE=$plane
            npm run test:native-files 2>&1 | tee logs/files-$plane.log
            npm run test:rpc-loader 2>&1 | tee logs/loader-$plane.log
            npm run test:rpc-owner 2>&1 | tee logs/owner-$plane.log
            npm run test:rpc-mixed 2>&1 | tee logs/mixed-$plane.log
          done
          npm run typecheck:gate 2>&1 | tee logs/typecheck.log
          npm run test:docs 2>&1 | tee logs/docs.log
          npm run test:docs-claims 2>&1 | tee logs/doc-claims.log
          npm run verify:install 2>&1 | tee logs/install.log
          sha256sum lib/*.js lib/*.js.map > logs/build.sha256
          npm run build > logs/rebuild.log 2>&1
          sha256sum -c logs/build.sha256
      - name: Verify real reported host in an isolated dependency tree
        shell: bash
        run: |
          set -o pipefail
          npm install --prefix .host-current --ignore-scripts --legacy-peer-deps --no-audit --no-fund @deepseek-ai/dsh@0.2.1-rc.2 @deepseek-ai/dsh-scope@0.2.1-rc.2 @deepseek-ai/dsh-fs@0.2.1-rc.2 @deepseek-ai/dsh-sandbox@0.2.1-rc.2 @deepseek-ai/dsh-output-retention@0.2.1-rc.2 @deepseek-ai/dsh-spill@0.2.1-rc.2
          npm run test:rpc-loader-host 2>&1 | tee logs/reported-host.log
      - name: Publish tested source and build without overwriting newer work
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/refactor/simplify-rpc-files | cut -f1)" = "$GITHUB_SHA"
          git diff --exit-code -- .github package.json package-lock.json ci
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/fs.ts src/host/wsl-search.ts src/shared/rpc-transport.ts src/shared/rpc-metrics.ts src/shared/native-files.ts tests/search-transport.test.mjs tests/rpc-config-metrics.test.mjs CHECKPOINT.md lib
          git commit -m 'refactor: simplify shared RPC and file execution without changing behaviour'
          git push origin HEAD:refs/heads/refactor/simplify-rpc-files
          test "$(git ls-remote origin refs/heads/refactor/simplify-rpc-files | cut -f1)" = "$(git rev-parse HEAD)"
          git rev-parse HEAD | tee logs/published-sha.txt
          git show --stat --oneline HEAD | tee logs/published-stat.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simplify-delivery-evidence
          path: logs/
          retention-days: 14
