name: known-issues-delivery
on:
  push:
    branches: [fix/uat-known-issues]
permissions:
  contents: write
jobs:
  verify:
    if: contains(github.event.head_commit.message, '[resume-build]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Demonstrate the two incorrect help statements before correction
        shell: bash
        run: |
          mkdir -p /tmp/known-issues
          node --experimental-strip-types --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { CLAIMS } from './tests/parity/claims.mjs'
          for (const id of ['panel-denies-run-in-background', 'panel-claims-a-ten-second-cache']) {
            const claim = CLAIMS.find(c => c.id === id)
            assert.ok(claim)
            assert.equal((await claim.run()).ok, false, id)
            console.log('Confirmed original failure:', id)
          }
          JS
      - run: node .ci-resume-fixes.mjs
      - name: Build and portable contracts
        shell: bash
        run: |
          npm run build 2>&1 | tee /tmp/known-issues/build.log
          npm run test:unit 2>&1 | tee /tmp/known-issues/unit.log
          npm run test:docs
          npm run test:docs-claims 2>&1 | tee /tmp/known-issues/docs.log
      - run: node ci/install-pinned.mjs
      - name: Existing and resumed regression contracts
        shell: bash
        run: |
          npm run test:node 2>&1 | tee /tmp/known-issues/host.log
          npm run test:search-transport 2>&1 | tee /tmp/known-issues/rpc.log
          npm run test:native-files 2>&1 | tee /tmp/known-issues/files-source.log
          DSH_WSL_TEST_PLANE=lib npm run test:native-files 2>&1 | tee /tmp/known-issues/files-lib.log
          DSH_WSL_TEST_PLANE=lib npm run test:rpc-owner 2>&1 | tee /tmp/known-issues/owner-lib.log
          DSH_WSL_TEST_PLANE=lib npm run test:rpc-mixed 2>&1 | tee /tmp/known-issues/mixed-lib.log
          npm run typecheck:gate
          npm run verify:install
      - name: Publish tested changes and matching build without overwriting newer work
        shell: bash
        run: |
          git add -- src/client/locales.ts tests/parity/claims.mjs tests/docs-debt.test.mjs scripts/run-docs-claims.mjs scripts/doc-claim-verdicts.mjs package.json lib
          git rm -- .ci-resume-fixes.mjs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: align help with shipped backends and retire proven documentation defects'
          npm run build >> /tmp/known-issues/build.log 2>&1
          git diff --exit-code -- lib
          node scripts/verify-lib-sync.mjs
          git fetch origin fix/uat-known-issues
          test "$(git rev-parse FETCH_HEAD)" = '${{ github.sha }}'
          git push origin HEAD:refs/heads/fix/uat-known-issues
          git rev-parse HEAD > /tmp/known-issues/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: known-issues-validation
          path: /tmp/known-issues
          retention-days: 14
