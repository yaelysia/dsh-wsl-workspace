name: cp10-delivery
on:
  push:
    branches: [fix/cp8-loader-rpc-pool]
permissions:
  contents: write
concurrency:
  group: cp10-delivery
  cancel-in-progress: false
jobs:
  deliver:
    if: contains(github.event.head_commit.message, '[cp10-build]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: node ci/install-pinned.mjs
      - name: Reproduce the exact main Loader failure before repair
        run: |
          mkdir -p logs
          set +e
          node --experimental-strip-types --test tests/rpc-loader-entry.test.mjs > logs/loader-before.log 2>&1
          code=$?
          set -e
          cat logs/loader-before.log
          test "$code" -ne 0
          grep -q 'actual default must wait' logs/loader-before.log
      - run: node .ci-cp10-apply.mjs
      - name: Build and existing regression gates
        run: |
          set -o pipefail
          npm run build 2>&1 | tee logs/build.log
          npm run test:unit 2>&1 | tee logs/unit.log
          npm run test:node 2>&1 | tee logs/host.log
          DSH_WSL_TEST_PLANE=lib npm run test:rpc-loader 2>&1 | tee logs/loader-lib.log
          npm run test:search-transport 2>&1 | tee logs/rpc.log
          npm run test:native-files 2>&1 | tee logs/files-source.log
          DSH_WSL_TEST_PLANE=lib npm run test:native-files 2>&1 | tee logs/files-lib.log
          npm run typecheck:gate
          npm run test:docs
          npm run test:docs-claims
          npm run verify:install
          sha256sum lib/*.js lib/*.js.map > logs/build-before.sha256
          npm run build > logs/rebuild.log 2>&1
          sha256sum -c logs/build-before.sha256
      - name: Install the actual reported host and its missing filesystem peers in isolation
        run: >-
          npm install --prefix .host-current --ignore-scripts --legacy-peer-deps --no-audit --no-fund
          @deepseek-ai/dsh@0.2.1-rc.2 @deepseek-ai/dsh-scope@0.2.1-rc.2
          @deepseek-ai/dsh-fs@0.2.1-rc.2 @deepseek-ai/dsh-sandbox@0.2.1-rc.2
          @deepseek-ai/dsh-output-retention@0.2.1-rc.2 @deepseek-ai/dsh-spill@0.2.1-rc.2
      - name: Actual 0.2.1-rc.2 Loader path on both source and build
        run: |
          set -o pipefail
          npm run test:rpc-loader-host 2>&1 | tee logs/current-host.log
      - name: Publish only tested source and matching lib without overwriting newer work
        run: |
          test "$(git ls-remote origin refs/heads/fix/cp8-loader-rpc-pool | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/host/wsl-search.ts package.json .github/workflows/native-files.yml lib
          git commit -m 'fix: preserve search metadata at the actual Loader default-export boundary'
          git push origin HEAD:refs/heads/fix/cp8-loader-rpc-pool
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cp10-delivery-evidence
          path: logs/
          retention-days: 14
