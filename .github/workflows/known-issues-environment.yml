name: known-issues-environment
on:
  push:
    branches: [fix/uat-known-issues]
    paths: [.github/workflows/known-issues-environment.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: node ci/install-pinned.mjs
      - name: Reported host, independent from old pins
        run: npm install --prefix .host-current --ignore-scripts --legacy-peer-deps --no-audit --no-fund @deepseek-ai/dsh@0.2.1-rc.2 @deepseek-ai/dsh-scope@0.2.1-rc.2
      - name: Reusable offline reproduction environment
        shell: bash
        run: |
          mkdir -p .runtime
          cp "$(command -v node)" .runtime/node
          git rev-parse HEAD > .runtime/source-commit.txt
          node --version > .runtime/node-version.txt
          python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path.cwd()
          for path in (root / 'node_modules' / '@deepseek-ai').iterdir():
              if path.is_symlink():
                  target = path.resolve()
                  if target.is_relative_to(root):
                      path.unlink()
                      path.symlink_to(os.path.relpath(target, path.parent), target_is_directory=True)
          PY
          tar --exclude=.git -czf "$RUNNER_TEMP/known-issues-environment.tar.gz" .
          sha256sum "$RUNNER_TEMP/known-issues-environment.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: known-issues-environment
          path: ${{ runner.temp }}/known-issues-environment.tar.gz
          retention-days: 2
