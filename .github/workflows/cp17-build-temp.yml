# Temporary delivery gate; remove after src/ and generated lib/ are verified.
name: cp17-build-temp
on:
  push:
    branches: ['perf/cp17-wildcard-anchor-prune']
    paths:
      - 'src/shared/search-patterns.ts'
      - 'src/shared/search-scripts.ts'
      - 'src/host/wsl-search.ts'
      - 'tests/grep-prune.test.mjs'
      - '.github/workflows/cp17-build-temp.yml'
permissions:
  contents: write
jobs:
  build-and-publish:
    if: github.repository == 'yaelysia/dsh-wsl-workspace'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: node ci/install-pinned.mjs
      - run: npm run build
      - name: New and existing semantics on source and shipped lib
        run: |
          set -e
          for plane in src lib; do
            export DSH_WSL_TEST_PLANE=$plane
            npm run test:grep-prune
            npm run test:traversal
          done
          npm run test:unit
          npm run typecheck:gate
      - name: Commit matching lib on isolated development branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A lib
          if ! git diff --cached --quiet; then
            git commit -m 'build(cp17): synchronize verified wildcard search library'
            git push origin HEAD:refs/heads/perf/cp17-wildcard-anchor-prune
          fi
